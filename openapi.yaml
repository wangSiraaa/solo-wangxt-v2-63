openapi: 3.0.3
info:
  title: 街道环卫考核 API
  version: 1.0.0
  description: |-
    道路网格、拍摄证据、问题事件、保洁合同与扣分处罚。

    感知哈希仅用于生成疑似重复候选；事件关联以位置、时间及人工判断为准。
paths:
  /api/clock/:
    get:
      operationId: clock_retrieve
      description: 'Test seam: pin / reset the clock that drives SLA escalation.'
      tags:
      - clock
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: clock_create
      description: 'Test seam: pin / reset the clock that drives SLA escalation.'
      tags:
      - clock
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClockSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClockSetRequest'
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
