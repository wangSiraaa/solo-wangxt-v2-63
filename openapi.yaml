components:
  schemas:
    ClockSetRequest:
      type: object
      properties:
        now:
          type: string
          format: date-time
        reset:
          type: boolean
          default: false
    Contract:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        contractor:
          type: integer
        contractor_name:
          type: string
          readOnly: true
        grid:
          type: integer
        grid_code:
          type: string
          readOnly: true
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contractor
      - contractor_name
      - created_at
      - grid
      - grid_code
      - id
      - valid_from
    ContractRequest:
      type: object
      properties:
        contractor:
          type: integer
        grid:
          type: integer
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true
      required:
      - contractor
      - grid
      - valid_from
    Contractor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    ContractorRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
    DecisionEnum:
      enum:
      - pending
      - same_event
      - different_place
      type: string
      description: |-
        * `pending` - 待人工判定
        * `same_event` - 确认同一事件(不同角度)
        * `different_place` - 相似但不同地点
    DuplicateCandidate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        photo:
          allOf:
          - $ref: '#/components/schemas/Photo'
          readOnly: true
        similar_photo:
          allOf:
          - $ref: '#/components/schemas/Photo'
          readOnly: true
        hamming_distance:
          type: integer
          readOnly: true
        distance_meters:
          type: number
          format: double
          readOnly: true
        time_gap_seconds:
          type: number
          format: double
          readOnly: true
        within_spatial_window:
          type: boolean
          readOnly: true
        within_temporal_window:
          type: boolean
          readOnly: true
        same_spot_repeat:
          type: boolean
          readOnly: true
        decision:
          allOf:
          - $ref: '#/components/schemas/DecisionEnum'
          readOnly: true
        decision_display:
          type: string
          readOnly: true
        decided_by:
          type: string
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - decided_at
      - decided_by
      - decision
      - decision_display
      - distance_meters
      - hamming_distance
      - id
      - photo
      - same_spot_repeat
      - similar_photo
      - time_gap_seconds
      - within_spatial_window
      - within_temporal_window
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: string
          maxLength: 64
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              description: GeoJSON 坐标，SRID 4326
          required:
          - type
          - coordinates
          readOnly: true
        grid:
          type: integer
        grid_code:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/EventStatusEnum'
        status_display:
          type: string
          readOnly: true
        opened_at:
          type: string
          format: date-time
        rectified_at:
          type: string
          format: date-time
          nullable: true
        merged_into:
          type: integer
          readOnly: true
        photo_ids:
          type: array
          items:
            type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
      required:
      - category
      - grid
      - grid_code
      - id
      - location
      - merged_into
      - opened_at
      - photo_ids
      - status_display
    EventRequest:
      type: object
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 64
        grid:
          type: integer
        status:
          $ref: '#/components/schemas/EventStatusEnum'
        opened_at:
          type: string
          format: date-time
        rectified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - category
      - grid
      - opened_at
    EventStatusEnum:
      enum:
      - open
      - rectified
      type: string
      description: |-
        * `open` - 待整改
        * `rectified` - 已整改
    KindEnum:
      enum:
      - problem
      - rectify
      type: string
      description: |-
        * `problem` - 问题照片
        * `rectify` - 整改照片
    LevelEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `0` - 基础扣分
        * `1` - 逾期一级(24h)
        * `2` - 逾期二级(48h)
        * `3` - 逾期三级(72h)
    PatchedContractRequest:
      type: object
      properties:
        contractor:
          type: integer
        grid:
          type: integer
