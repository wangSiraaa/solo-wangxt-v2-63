          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedContractorRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contractor'
          description: ''
    delete:
      operationId: contractors_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this contractor.
        required: true
      tags:
      - contractors
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/contracts/:
    get:
      operationId: contracts_list
      tags:
      - contracts
      security:
