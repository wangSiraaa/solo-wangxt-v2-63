  /api/duplicate-candidates/{id}/decide/:
    post:
      operationId: duplicate_candidates_decide_create
      description: |-
        Human verdict: same_event merges; different_place keeps them apart
        even if the photos are visually identical.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this duplicate candidate.
        required: true
      tags:
      - duplicate-candidates
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidate'
          description: ''
  /api/escalations/:
    get:
      operationId: escalations_retrieve
      description: 按当前(可注入)时钟执行逾期升级扫描；幂等，可重复运行。
      tags:
      - escalations
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: escalations_create
      description: 同 GET：触发一次逾期升级扫描。
      tags:
      - escalations
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/events/:
