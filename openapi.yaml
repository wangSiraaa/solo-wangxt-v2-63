      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
          description: ''
    delete:
      operationId: contracts_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cleaning contract.
        required: true
      tags:
      - contracts
      security:
      - {}
      responses:
        '204':
          description: No response body
