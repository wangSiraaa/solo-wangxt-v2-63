          description: ''
  /api/contractors/{id}/:
    get:
      operationId: contractors_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this contractor.
        required: true
      tags:
      - contractors
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contractor'
          description: ''
    put:
      operationId: contractors_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this contractor.
        required: true
      tags:
      - contractors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContractorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContractorRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contractor'
          description: ''
    patch:
      operationId: contractors_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this contractor.
        required: true
      tags:
